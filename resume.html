<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Divyansh Agarwal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .resume-page {
            min-height: 100vh;
            padding-top: 90px;
            padding-bottom: 3rem;
        }
        .resume-header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 36rem;
            margin-left: auto;
            margin-right: auto;
        }
        .resume-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .resume-header p {
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.55;
        }
        .resume-request-card {
            max-width: 480px;
            margin: 0 auto;
            padding: 2rem 2rem 2.25rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .resume-request-card {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
        }
        .resume-request-card label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text);
        }
        .resume-request-card .field {
            margin-bottom: 1.25rem;
        }
        .resume-request-card input[type="email"],
        .resume-request-card input[type="text"],
        .resume-request-card textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .resume-request-card input::placeholder,
        .resume-request-card textarea::placeholder {
            color: var(--muted);
            opacity: 0.85;
        }
        .resume-request-card input:focus,
        .resume-request-card textarea:focus {
            outline: none;
            border-color: var(--accent, #6366f1);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .resume-request-card textarea {
            min-height: 100px;
            resize: vertical;
        }
        .resume-request-card .field-hint {
            font-size: 0.8125rem;
            color: var(--muted);
            margin-top: 0.35rem;
            line-height: 1.4;
        }
        .resume-request-card .btn-submit {
            width: 100%;
            margin-top: 0.25rem;
        }
        .resume-request-success {
            max-width: 480px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
            text-align: center;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--card-bg);
        }
        .resume-request-success h2 {
            font-size: 1.35rem;
            margin-bottom: 0.75rem;
        }
        .resume-request-success p {
            color: var(--muted);
            margin-bottom: 1.5rem;
            line-height: 1.55;
        }
    </style>
</head>
<body>

<!-- Scroll Progress Bar -->
<div class="scroll-progress" id="scroll-progress"></div>

<!-- Particles Canvas -->
<canvas id="particles-canvas"></canvas>

<!-- Mouse Follower -->
<div class="mouse-glow" id="mouse-glow"></div>

<!-- Ambient Background Blob -->
<div class="ambient-blob ambient-blob-3"></div>

<!-- Navigation -->
<nav class="navbar" id="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">
            <span class="logo-text">D<span class="logo-dot">.</span>A</span>
        </a>
        <div class="nav-links" id="nav-links">
            <a href="index.html#about" class="nav-link">About</a>
            <a href="index.html#skills" class="nav-link">Skills</a>
            <a href="index.html#experience" class="nav-link">Experience</a>
            <a href="projects.html" class="nav-link">Projects</a>
            <a href="index.html#blogs" class="nav-link">Blog</a>
            <a href="index.html#contact" class="nav-link">Contact</a>
            <a href="resume.html" class="nav-link nav-cta active">Resume</a>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</nav>

<section class="resume-page">
    <div class="container">
        <div class="resume-header">
            <h1>Request my <span class="gradient-text">resume</span></h1>
            <p>Please leave your email and I’ll send you a copy.</p>
        </div>

        <div id="resume-request-form-wrap">
            <!-- FormSubmit: first submission sends a confirmation link to your inbox; activate once. -->
            <form class="resume-request-card tilt-card" action="https://formsubmit.co/divyanshag2000@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="Resume request — portfolio">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_next" id="resume-next-url" value="">
                <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0;height:0;width:0">

                <div class="field">
                    <label for="resume-email">Your email</label>
                    <input type="email" id="resume-email" name="email" required autocomplete="email" placeholder="you@example.com">
                    <p class="field-hint">I’ll reply from my usual address with the resume attached or linked.</p>
                </div>
                <div class="field">
                    <label for="resume-company">Company</label>
                    <input type="text" id="resume-company" name="company" required autocomplete="organization" placeholder="Company name">
                </div>
                <div class="field">
                    <label for="resume-note">Note <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
                    <textarea id="resume-note" name="message" placeholder="Company, role, or anything that helps me tailor what I send"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-submit">Request resume</button>
            </form>
        </div>
    </div>
</section>

<div class="page-transition active" id="page-transition"></div>

<script src="js/main.js"></script>
<script>
    (function () {
        var nextField = document.getElementById('resume-next-url');
        if (nextField) {
            var thankYouUrl = new URL('resume-requested.html', window.location.href);
            nextField.value = thankYouUrl.toString();
        }
    })();
</script>
</body>
</html>
