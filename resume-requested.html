        .resume-thanks-page {
            min-height: 100vh;
            padding-top: 90px;
            padding-bottom: 3rem;
            display: flex;
            align-items: center;
        }
        .resume-thanks-card {
            max-width: 560px;
            margin: 0 auto;
            text-align: center;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        [data-theme="dark"] .resume-thanks-card {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
        }
        .resume-thanks-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.9rem;
        }
        .resume-thanks-card p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.65;
            margin-bottom: 1rem;
        }
        .resume-thanks-actions {
            margin-top: 1.75rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
    </style>
